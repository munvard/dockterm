appId: com.dockterm.app
productName: DockTerm
copyright: Copyright © 2026 Menua Vardanyan

# node-pty ships prebuilt N-API binaries (ABI-stable across Node and Electron),
# so electron-builder must not try to recompile it (its bundled winpty source
# build is broken on Windows). Linux has no prebuild and is rebuilt in CI.
npmRebuild: false
afterPack: build/afterPack.cjs

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - build/icon.png
  # node-pty ships prebuilt binaries for every platform+arch it supports, and
  # a .pdb debug-symbol file alongside each Windows one — neither is ever
  # needed at runtime on any OS, so drop the ones this build isn't. The
  # per-platform sections below additionally drop the OTHER OS's prebuilds.
  - "!**/node_modules/node-pty/prebuilds/**/*.pdb"

asarUnpack:
  - resources/**
  - build/icon.png
  - "**/node_modules/node-pty/**"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
  # A files list with only "!" patterns makes electron-builder prepend **/*,
  # which packs the whole repo, so each platform list repeats the includes.
  files:
    - out/**/*
    - package.json
    - build/icon.png
    - "!**/node_modules/node-pty/prebuilds/**/*.pdb"
    - "!**/node_modules/node-pty/prebuilds/darwin-*/**"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  # No auto-updater, so skip the differential-download .blockmap sidecar file.
  differentialPackage: false

mac:
  target:
    - target: dmg
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Code signing + notarization are driven entirely by environment/secrets in CI
  # (see .github/workflows/release.yml and SIGNING.md). When no Apple cert is
  # present the build falls back to an unsigned .dmg instead of failing.
  # Hardened runtime + these entitlements are required for Apple notarization;
  # they are no-ops when the build is unsigned.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # A files list with only "!" patterns makes electron-builder prepend **/*,
  # which packs the whole repo, so each platform list repeats the includes.
  files:
    - out/**/*
    - package.json
    - build/icon.png
    - "!**/node_modules/node-pty/prebuilds/**/*.pdb"
    - "!**/node_modules/node-pty/prebuilds/win32-*/**"
  # Required alongside entitlements.mac.plist's audio-input entitlement: macOS
  # refuses to even show the mic permission prompt without a usage string, and
  # attributes it to DockTerm (the responsible top-level app), not to whatever
  # CLI a user runs inside its terminal.
  extendInfo:
    NSMicrophoneUsageDescription: "Claude Code's voice mode records through DockTerm's terminal."

dmg:
  # Off on purpose: electron-builder would write latest-mac.yml from BOTH parallel mac
  # jobs (one arch each) and they would race. The mac jobs write per-arch
  # latest-mac-<arch>.yml themselves (scripts/write-update-info.mjs).
  writeUpdateInfo: false
  title: ${productName} ${version}
  background: build/background.png
  iconSize: 128
  iconTextSize: 13
  window:
    width: 660
    height: 420
  contents:
    - x: 180
      y: 230
      type: file
    - x: 480
      y: 230
      type: link
      path: /Applications

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  icon: build/icon.png
  maintainer: Menua Vardanyan <taronmenua@gmail.com>
  synopsis: Terminal-first workspace for Claude Code
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  # A files list with only "!" patterns makes electron-builder prepend **/*,
  # which packs the whole repo, so each platform list repeats the includes.
  files:
    - out/**/*
    - package.json
    - build/icon.png
    - "!**/node_modules/node-pty/prebuilds/**/*.pdb"
    - "!**/node_modules/node-pty/prebuilds/darwin-*/**"
    - "!**/node_modules/node-pty/prebuilds/win32-*/**"

publish:
  provider: github
  owner: munvard
  repo: dockterm
